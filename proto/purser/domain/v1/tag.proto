syntax = "proto3";

package purser.domain.v1;

import "google/protobuf/field_mask.proto";
import "purser/domain/v1/common.proto";

option go_package = "purser/gen/go/purser/domain/v1;domainv1";

// Tag is the wire shape of internal/domain.Tag. This service covers only
// the tag catalog's own CRUD — attaching a Tag to an entity (a Network, a
// Studio, a Scene, a Performer, ...) is TagAssignmentService, in
// tag_assignment.proto. See docs/technical/tag-assignment.md.
message Tag {
  string id = 1;
  string key = 2;
  string value = 3;
  TagScope scope = 4;
  string category = 5;
}

message CreateTagRequest {
  Tag tag = 1;
}

message CreateTagResponse {
  Tag tag = 1;
}

message GetTagRequest {
  string id = 1;
}

message GetTagResponse {
  Tag tag = 1;
}

message UpdateTagRequest {
  Tag tag = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateTagResponse {
  Tag tag = 1;
}

message DeleteTagRequest {
  string id = 1;
  // cascade has no effect for Tag — its only referrer, TagAssignment, is
  // always unlinked. Present for API-shape consistency with every other
  // entity's DeleteXxxRequest. See
  // docs/adr/0015-deletion-impact-and-composing-services.md.
  bool cascade = 2;
}

message DeleteTagResponse {}

message GetTagDeletionImpactRequest {
  string id = 1;
}

message GetTagDeletionImpactResponse {
  repeated DeletionImpactRow impacts = 1;
}

message ListTagsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListTagsResponse {
  repeated Tag tags = 1;
  string next_page_token = 2;
}

// TagService owns exactly one entity — Tag — per
// docs/adr/0011-api-design.md's SRP-per-entity rule.
service TagService {
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc GetTag(GetTagRequest) returns (GetTagResponse);
  rpc UpdateTag(UpdateTagRequest) returns (UpdateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  // GetTagDeletionImpact reports what references this Tag before Delete
  // is called — see docs/adr/0015-deletion-impact-and-composing-services.md.
  rpc GetTagDeletionImpact(GetTagDeletionImpactRequest) returns (GetTagDeletionImpactResponse);
}
