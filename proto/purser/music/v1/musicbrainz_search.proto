syntax = "proto3";

package purser.music.v1;

option go_package = "purser/gen/go/purser/music/v1;musicv1";

// MusicBrainzReleaseGroup is one candidate album MusicBrainz's own free-text
// search returned — the conceptual album, independent of any specific
// pressing/edition. Named distinctly from this package's own ReleaseGroup-
// shaped domain messages (purser.domain.v1.Group) since this is raw
// external identity-graph data, not a persisted Purser entity — mirrors
// ports.ReleaseGroup (internal/adapters/musicbrainz)'s own DTO/domain
// separation.
message MusicBrainzReleaseGroup {
  string mbid = 1;
  string title = 2;
  string disambiguation = 3;
  string primary_type = 4;
  repeated string secondary_types = 5;
  string first_release_date = 6;
}

// MusicBrainzRelease is one specific pressing/edition of a
// MusicBrainzReleaseGroup — what a human is actually choosing between when
// picking which edition of an album is the one on disk.
// format/medium_count/track_count/label summarize the first medium/
// label-info entry, enough to distinguish editions in a list without a
// second round trip per candidate; the full tracklist isn't duplicated
// here — AcceptCandidateRequest's external_ref is the chosen release's
// mbid, and Persist (docs/technical/pipeline-music-persist.md) fetches
// the full release itself once a specific edition is accepted.
message MusicBrainzRelease {
  string mbid = 1;
  string title = 2;
  string disambiguation = 3;
  string country = 4;
  string date = 5;
  string barcode = 6;
  string status = 7;
  string format = 8;
  int32 medium_count = 9;
  int32 track_count = 10;
  repeated string artist_credit_names = 11;
  string label = 12;
}

// MusicBrainzArtist is MusicBrainz's artist DTO — the identity anchor for a
// person, group, orchestra, choir, character, or other credited entity.
// Deliberately not the full ports.Artist shape (no area/begin-area/isni/ipi/
// gender/relations) — this is the browse-list summary a human picks from
// before drilling into a specific artist's discography via
// ListReleaseGroupsForArtist, mirroring MusicBrainzReleaseGroup/
// MusicBrainzRelease's own summarize-for-the-list convention above.
message MusicBrainzArtist {
  string mbid = 1;
  string name = 2;
  string sort_name = 3;
  string disambiguation = 4;
  string type = 5;           // "Person" | "Group" | "Other" — MusicBrainz's own vocabulary
  string country = 6;
  string life_span_begin = 7;
  string life_span_end = 8;
  repeated string aliases = 9;
}

// SearchMusicBrainzArtistsRequest free-text searches MusicBrainz artists by
// name — the "Add Artist" entry point: find the artist before browsing
// their discography.
message SearchMusicBrainzArtistsRequest {
  string query = 1;
}

message SearchMusicBrainzArtistsResponse {
  repeated MusicBrainzArtist artists = 1;
}

// ListMusicBrainzArtistReleaseGroupsRequest lists every release group
// (album) credited to one artist by artist MBID — the step after
// SearchArtists narrows to a single artist: "here is their full
// discography," used by Add Artist/Add Album to browse a known artist's
// catalog rather than free-text searching one album at a time.
message ListMusicBrainzArtistReleaseGroupsRequest {
  string artist_mbid = 1;
}

message ListMusicBrainzArtistReleaseGroupsResponse {
  repeated MusicBrainzReleaseGroup release_groups = 1;
}

// SearchMusicBrainzReleaseGroupsRequest free-text searches MusicBrainz by
// artist and album name — the same query M7's own fuzzy-tag identification
// path already issues automatically (adapters/pipeline/music.Identifier),
// now available as an explicit, human-driven RPC: "search for this album"
// rather than only ever running implicitly during a scan.
message SearchMusicBrainzReleaseGroupsRequest {
  string artist_name = 1;
  string album_name = 2;
}

message SearchMusicBrainzReleaseGroupsResponse {
  repeated MusicBrainzReleaseGroup release_groups = 1;
}

// GetMusicBrainzArtistRequest looks up one artist by MBID — used when a
// caller already knows the exact artist (e.g. "refresh this artist's
// metadata from MusicBrainz"), unlike SearchArtists' free-text browse.
message GetMusicBrainzArtistRequest {
  string mbid = 1;
}

// MusicBrainzArtistMember is one band-member edge from a Group artist's
// "member of band" relations — the Add Artist flow's source for creating
// the corresponding Person/EntryPerson rows (see docs/technical/music-web-ui.md).
// attributes is MusicBrainz's own instrument/role detail on the relation
// (e.g. "vocal", "guitar"); begin/end/ended describe the relation's own
// life span (when this person joined/left the band), distinct from the
// member's own MusicBrainzArtist life span.
message MusicBrainzArtistMember {
  string mbid = 1;
  string name = 2;
  repeated string attributes = 3;
  string begin = 4;
  string end = 5;
  bool ended = 6;
}

// GetMusicBrainzArtistResponse's extra fields (isnis/official_url/
// wikipedia_url/members) come from the same MusicBrainz relations data
// SearchArtists' MusicBrainzArtist deliberately omits (see that message's
// own doc comment) — GetArtist is the "caller already knows the exact
// artist" lookup, the right place for the heavier per-artist detail
// nothing else needs.
message GetMusicBrainzArtistResponse {
  MusicBrainzArtist artist = 1;
  repeated string isnis = 2;
  string official_url = 3;
  string wikipedia_url = 4;
  repeated MusicBrainzArtistMember members = 5;
}

// ListMusicBrainzReleasesRequest lists every known pressing/edition of one
// release group — the step after SearchReleaseGroups narrows to a single
// album: "which of these N editions is the one on disk."
message ListMusicBrainzReleasesRequest {
  string release_group_mbid = 1;
}

message ListMusicBrainzReleasesResponse {
  repeated MusicBrainzRelease releases = 1;
}

// MusicBrainzService exposes internal/adapters/musicbrainz's read-only
// search/browse capability directly — these RPCs already existed as
// ports.MusicBrainzClient methods (SearchReleaseGroups,
// ListReleasesForReleaseGroup, SearchArtists, ListReleaseGroupsForArtist),
// used internally by the identifier's own candidate generation, but were
// never reachable by a caller wanting to browse MusicBrainz directly:
// AcceptCandidateRequest only ever accepted a candidate the automatic
// search already surfaced, or a raw MBID a human already knew from
// browsing musicbrainz.org outside Purser entirely. This is the "manual
// add an artist"-style consumer M2's own design doc noted as a future
// user of the same adapter (docs/technical/music-musicbrainz-adapter.md)
// — arriving here: SearchArtists/ListReleaseGroupsForArtist are Add
// Artist/Add Album's entry points, browsing a known artist's full
// discography rather than only ever free-text searching one album at a
// time. GetArtist looks up a single already-known MBID directly — built
// for "refresh artist metadata from MusicBrainz" rather than
// speculatively; it's the same LookupArtist ports.MusicBrainzClient
// already exposes, simply not wired to a caller until now. Deliberately
// read-only: no RPC here writes anything; AcceptCandidate
// (purser.pipeline.v1.UnmatchedFileService) is still the only write
// path, unchanged.
service MusicBrainzService {
  rpc SearchReleaseGroups(SearchMusicBrainzReleaseGroupsRequest) returns (SearchMusicBrainzReleaseGroupsResponse);
  rpc ListReleasesForReleaseGroup(ListMusicBrainzReleasesRequest) returns (ListMusicBrainzReleasesResponse);
  rpc SearchArtists(SearchMusicBrainzArtistsRequest) returns (SearchMusicBrainzArtistsResponse);
  rpc ListReleaseGroupsForArtist(ListMusicBrainzArtistReleaseGroupsRequest) returns (ListMusicBrainzArtistReleaseGroupsResponse);
  rpc GetArtist(GetMusicBrainzArtistRequest) returns (GetMusicBrainzArtistResponse);
}
