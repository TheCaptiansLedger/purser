# Auto-provisioned Grafana datasources for the local dev observability
# stack — see docs/adr/0018-local-development-environment.md.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
