syntax = "proto3";

package purser.domain.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "purser/domain/v1/common.proto";

option go_package = "purser/gen/go/purser/domain/v1;domainv1";

// Item is the wire shape of internal/domain.Item. content_type stays a
// plain string (open vocabulary, see library_entry.proto); status uses
// the closed ItemStatus enum since Item.Status is a validated oneof in
// the domain, unlike LibraryEntry.Status.
message Item {
  string id = 1;
  string content_type = 2;
  string library_entry_id = 3;
  string group_id = 4;
  string title = 5;
  string overview = 6;
  google.protobuf.Timestamp date = 7;
  string sequence = 8;
  int32 runtime_seconds = 9;
  bool monitored = 10;
  ItemStatus status = 11;
  google.protobuf.Struct metadata = 12;
}

message CreateItemRequest {
  // id is server-generated; any value sent here is ignored. See
  // docs/adr/0020-server-generated-kernel-entity-ids.md.
  Item item = 1;
}

message CreateItemResponse {
  Item item = 1;
}

message GetItemRequest {
  string id = 1;
}

message GetItemResponse {
  Item item = 1;
}

message UpdateItemRequest {
  Item item = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateItemResponse {
  Item item = 1;
}

message DeleteItemRequest {
  string id = 1;
  // cascade has no effect for Item today — every referrer is a pure
  // attachment row and always unlinks. Present for API-shape consistency
  // with every other entity's DeleteXxxRequest. See
  // docs/adr/0015-deletion-impact-and-composing-services.md.
  bool cascade = 2;
}

message DeleteItemResponse {}

message GetItemDeletionImpactRequest {
  string id = 1;
}

message GetItemDeletionImpactResponse {
  repeated DeletionImpactRow impacts = 1;
}

// BulkDeleteItems is one of the two bulk-delete endpoints named by
// docs/adr/0016-bulk-operations.md — a real multi-select UI action
// ("delete these 12 duplicate scenes"), not a blanket bulk rollout.
message BulkDeleteItemsRequest {
  repeated string ids = 1;
  // cascade has no effect for Item today — see DeleteItemRequest.cascade.
  bool cascade = 2;
}

message BulkDeleteItemsResponse {}

message ListItemsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // library_entry_id, content_type, and group_id are independent,
  // optional filters — leave unset for no filter on that field.
  string library_entry_id = 3;
  string content_type = 4;
  string group_id = 5;
}

message ListItemsResponse {
  repeated Item items = 1;
  string next_page_token = 2;
}

// ItemService owns exactly one entity — Item — per
// docs/adr/0011-api-design.md's SRP-per-entity rule.
service ItemService {
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  // GetItemDeletionImpact reports what references this Item before Delete
  // is called — see docs/adr/0015-deletion-impact-and-composing-services.md.
  rpc GetItemDeletionImpact(GetItemDeletionImpactRequest) returns (GetItemDeletionImpactResponse);
  // BulkDeleteItems removes every Item in ids atomically — see
  // docs/adr/0016-bulk-operations.md.
  rpc BulkDeleteItems(BulkDeleteItemsRequest) returns (BulkDeleteItemsResponse);
}
