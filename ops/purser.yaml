server:
  listen_addr: ":7474"

# Base directory Purser's own data lives under (Badger's data dir and the
# SQLite DSN both default under it — see database.badger.data_dir /
# database.sql.dsn below). Defaults to the OS-appropriate per-user app data
# directory when unset.
paths:
  data_dir: /data/purser

database:
  driver: badger
  badger:
    data_dir: /data/purser-badger
  # ANSI-SQL alternative (postgres, mysql, or sqlite share this one dsn-shaped block):
  #   driver: sqlite   # or postgres, mysql
  #   sql:
  #     dsn: /data/purser.db

media:
  path: /media/purser

modules:
  movies:
    enabled: true
    roots:
      - /media/content/movies
  tv:
    enabled: true
    roots:
      - /media/content/tv
  music:
    enabled: true
    roots:
      - /media/content/music
  books:
    enabled: true
    roots:
      - /media/content/books
  afterdark:
    enabled: true
    roots:
      - /media/content/afterdark
      - /media/content/jav

log:
  level: debug
  format: text

# Sends traces to Tempo and exposes Prometheus-scraped metrics on :9464 —
# both are services in this same compose stack. See
# docs/adr/0007-telemetry.md and docs/adr/0018-local-development-environment.md.
telemetry:
  enabled: true
  otlp_endpoint: tempo:4317
  otlp_insecure: true
  metrics_addr: ":9464"

# Common scan/hash/queue pipeline — see docs/adr/0024-pipeline-core.md.
# OSHash and SHA1 are always computed; MD5/SHA512 are optional extra
# hashes, off by default.
pipeline:
  enable_md5: true
  enable_sha512: true
  # Directories watched live for changes; each settled unit triggers the
  # same scan TriggerScan invokes explicitly. Empty (the default) starts
  # no watcher at all. Each root pairs its path with the content type
  # every file under it belongs to, so grouping/fingerprinting/identifying
  # a discovered file can pick the right content-type-specific capability
  # — see docs/technical/pipeline-grouping-capability.md.
  scan_roots:
    - path: /media/incoming
      content_type: music
  # Organizer naming templates, per content type — see
  # docs/adr/0024-pipeline-core.md and
  # docs/technical/pipeline-music-organizer.md. Auto-organize is off by
  # default (auto_organize: true enables it); manual organizing is always
  # available via the OrganizerService RPC regardless of this setting.
  organize:
    adult:
      root: /media/library/afterdark
      template: "{{.Studio}}/{{.SceneDate | default \"unknown-date\"}} - {{.SceneTitle}}{{if .SceneCode}} [{{.SceneCode}}]{{end}}{{.Ext}}"

# MusicBrainz adapter (internal/adapters/musicbrainz) — see
# docs/technical/music-musicbrainz-adapter.md. base_url is empty by default
# (the adapter's own musicbrainz.org default); response_header_timeout is
# empty by default too (the adapter's own 25s default, already raised
# above pkg/httpclient's generic 10s — a real, uncached release/artist
# lookup with a heavy inc= can legitimately take 8-10s+ on a cold request).
# Raise it further here if your deployment sees it timing out anyway.
# musicbrainz:
#   response_header_timeout: 45s

# Prowlarr adapter (internal/adapters/prowlarr) — see
# docs/technical/acquisition-indexer-search.md. Disabled by default; no
# public default instance exists, so base_url is required to enable it.
# response_header_timeout is empty by default (the adapter's own 25s
# default — a real search fans out to every enabled indexer and waits for
# the slowest one). Raise it further here if your deployment sees it
# timing out anyway.
# prowlarr:
#   enabled: true
#   base_url: http://prowlarr.local:9696/api/v1
#   api_key: ""
#   response_header_timeout: 45s

# SABnzbd adapter (internal/adapters/sabnzbd) — see
# docs/technical/acquisition-download-client.md. Disabled by default; no
# public default instance exists, so base_url is required to enable it.
# Authenticates via a static api_key query parameter, no login step.
# sabnzbd:
#   enabled: true
#   base_url: http://sabnzbd.local:8080/sabnzbd
#   api_key: ""
