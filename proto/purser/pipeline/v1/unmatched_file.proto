syntax = "proto3";

package purser.pipeline.v1;

import "google/protobuf/timestamp.proto";
import "purser/domain/v1/media_file.proto";

option go_package = "purser/gen/go/purser/pipeline/v1;pipelinev1";

// UnmatchedFileStatus mirrors domain.UnmatchedFileStatus — the review
// queue's lifecycle state. See docs/adr/0024-pipeline-core.md.
enum UnmatchedFileStatus {
  UNMATCHED_FILE_STATUS_UNSPECIFIED = 0;
  UNMATCHED_FILE_STATUS_PENDING = 1;
  UNMATCHED_FILE_STATUS_MATCHED = 2;
  UNMATCHED_FILE_STATUS_DISMISSED = 3;
}

// UnmatchedFile is a file the common scan pipeline discovered and hashed
// but has not yet matched to a LibraryEntry/Item. See
// docs/adr/0024-pipeline-core.md.
message UnmatchedFile {
  string id = 1;
  string path = 2;
  int64 size = 3;

  string os_hash = 4;
  string md5 = 5;
  string sha1 = 6;
  string sha512 = 7;

  google.protobuf.Timestamp discovered_at = 8;
  UnmatchedFileStatus status = 9;
}

message GetUnmatchedFileRequest {
  string id = 1;
}

message GetUnmatchedFileResponse {
  UnmatchedFile unmatched_file = 1;
}

message ListUnmatchedFilesRequest {
  int32 page_size = 1;
  string page_token = 2;
  // status is an optional filter — leave UNMATCHED_FILE_STATUS_UNSPECIFIED
  // for no filter.
  UnmatchedFileStatus status = 3;
}

message ListUnmatchedFilesResponse {
  repeated UnmatchedFile unmatched_files = 1;
  string next_page_token = 2;
}

// ResolveUnmatchedFileRequest resolves a review-queue entry one of two
// ways: match it to an existing Item (item_id set — creates a real
// MediaFile linking the file's path/hashes to that Item, then removes the
// UnmatchedFile), or dismiss it (kept, not deleted, with
// status=dismissed, so a later rescan's "already known" short-circuit
// doesn't silently re-queue it). See docs/adr/0024-pipeline-core.md.
message ResolveUnmatchedFileRequest {
  string unmatched_file_id = 1;
  oneof outcome {
    string item_id = 2;
    bool dismiss = 3;
  }
}

message ResolveUnmatchedFileResponse {
  // result is the real, resolved entity: the newly created MediaFile when
  // outcome was item_id, or the UnmatchedFile (now status=dismissed) when
  // outcome was dismiss.
  oneof result {
    purser.domain.v1.MediaFile media_file = 1;
    UnmatchedFile unmatched_file = 2;
  }
}

// UnmatchedFileService is the review queue's Get/List/Resolve surface.
// Follows the same handler/service/error-mapping conventions as every
// other entity's Connect service (docs/adr/0011-api-design.md). See
// docs/adr/0024-pipeline-core.md.
service UnmatchedFileService {
  rpc GetUnmatchedFile(GetUnmatchedFileRequest) returns (GetUnmatchedFileResponse);
  rpc ListUnmatchedFiles(ListUnmatchedFilesRequest) returns (ListUnmatchedFilesResponse);
  rpc ResolveUnmatchedFile(ResolveUnmatchedFileRequest) returns (ResolveUnmatchedFileResponse);
}
