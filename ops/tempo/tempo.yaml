# Minimal single-binary Tempo config for local dev — see
# docs/adr/0018-local-development-environment.md. Receives OTLP directly
# from Purser (internal/config/telemetry.go's otlp_endpoint) and from
# anything else pointed at it; Grafana reads it back out as a datasource.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
