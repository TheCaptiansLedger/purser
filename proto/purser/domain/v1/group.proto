syntax = "proto3";

package purser.domain.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "purser/domain/v1/common.proto";

option go_package = "purser/gen/go/purser/domain/v1;domainv1";

// Group is the wire shape of internal/domain.Group.
message Group {
  string id = 1;
  string library_entry_id = 2;
  string title = 3;
  string sort_name = 4;
  string number = 5;
  int32 year = 6;
  string overview = 7;
  bool monitored = 8;
  MonitorMode monitor_mode = 9;
  google.protobuf.Struct metadata = 10;
}

message CreateGroupRequest {
  // id is server-generated; any value sent here is ignored. See
  // docs/adr/0020-server-generated-kernel-entity-ids.md.
  Group group = 1;
}

message CreateGroupResponse {
  Group group = 1;
}

message GetGroupRequest {
  string id = 1;
}

message GetGroupResponse {
  Group group = 1;
}

message UpdateGroupRequest {
  Group group = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateGroupResponse {
  Group group = 1;
}

message DeleteGroupRequest {
  string id = 1;
  // cascade has no effect for Group today — Item.group_id is optional,
  // so Delete always detaches Items (clearing group_id) rather than
  // deleting them; every other referrer is a pure attachment row and
  // always unlinks. Present for API-shape consistency with every other
  // entity's DeleteXxxRequest. See
  // docs/adr/0015-deletion-impact-and-composing-services.md.
  bool cascade = 2;
}

message DeleteGroupResponse {}

message GetGroupDeletionImpactRequest {
  string id = 1;
}

message GetGroupDeletionImpactResponse {
  repeated DeletionImpactRow impacts = 1;
}

message ListGroupsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // library_entry_id is an optional filter — leave unset for no filter.
  string library_entry_id = 3;
}

message ListGroupsResponse {
  repeated Group groups = 1;
  string next_page_token = 2;
}

// GroupService owns exactly one entity — Group — per
// docs/adr/0011-api-design.md's SRP-per-entity rule.
service GroupService {
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  // GetGroupDeletionImpact reports what references this Group before
  // Delete is called — see
  // docs/adr/0015-deletion-impact-and-composing-services.md.
  rpc GetGroupDeletionImpact(GetGroupDeletionImpactRequest) returns (GetGroupDeletionImpactResponse);
}
