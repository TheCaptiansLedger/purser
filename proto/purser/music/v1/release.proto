syntax = "proto3";

package purser.music.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "purser/domain/v1/common.proto";
import "purser/domain/v1/item.proto";

option go_package = "purser/gen/go/purser/music/v1;musicv1";

// ReleaseStatus mirrors internal/domain/music.ReleaseStatus — Music's own
// closed acquisition state for a Release, distinct from the shared
// purser.domain.v1.ItemStatus pipeline.
enum ReleaseStatus {
  RELEASE_STATUS_UNSPECIFIED = 0;
  RELEASE_STATUS_STUB = 1;
  RELEASE_STATUS_PARTIAL = 2;
  RELEASE_STATUS_IMPORTED = 3;
}

// Release is the wire shape of internal/domain/music.Release — a specific
// pressing/edition of a Release Group (purser.domain.v1.Group), the fourth
// tier Music adds on top of the shared kernel. See
// docs/adr/0021-music-domain-model.md.
message Release {
  string id = 1;
  string group_id = 2;
  string library_entry_id = 3;
  string title = 4;
  string country = 5;
  google.protobuf.Timestamp date = 6;
  string label = 7;
  string catalog_number = 8;
  string barcode = 9;
  string format = 10;
  int32 medium_count = 11;
  int32 track_count = 12;
  bool is_default = 13;
  bool monitored = 14;
  ReleaseStatus status = 15;
  string mbid = 16;
  google.protobuf.Timestamp added_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message CreateMusicReleaseRequest {
  // id is server-generated; any value sent here is ignored. See
  // docs/adr/0020-server-generated-kernel-entity-ids.md.
  Release music_release = 1;
}

message CreateMusicReleaseResponse {
  Release music_release = 1;
}

message GetMusicReleaseRequest {
  string id = 1;
}

message GetMusicReleaseResponse {
  Release music_release = 1;
}

message GetMusicReleaseByMBIDRequest {
  string mbid = 1;
}

message GetMusicReleaseByMBIDResponse {
  Release music_release = 1;
}

message GetMusicReleaseByBarcodeRequest {
  string barcode = 1;
}

message GetMusicReleaseByBarcodeResponse {
  Release music_release = 1;
}

message UpdateMusicReleaseRequest {
  Release music_release = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateMusicReleaseResponse {
  Release music_release = 1;
}

message DeleteMusicReleaseRequest {
  string id = 1;
  // cascade has no effect — Delete always runs Unlink (clearing
  // Item.metadata["release_id"] on every referencing track, then deleting
  // the release), the only mode this entity builds. Present for API-shape
  // consistency with every other entity's DeleteXxxRequest, same as
  // DeleteGroupRequest.cascade. See docs/adr/0021-music-domain-model.md and
  // docs/adr/0015-deletion-impact-and-composing-services.md.
  bool cascade = 2;
}

message DeleteMusicReleaseResponse {}

message GetMusicReleaseDeletionImpactRequest {
  string id = 1;
}

message GetMusicReleaseDeletionImpactResponse {
  repeated purser.domain.v1.DeletionImpactRow impacts = 1;
}

message ListMusicReleasesRequest {
  int32 page_size = 1;
  string page_token = 2;
  // group_id and library_entry_id are independent, optional filters — leave
  // both unset for no filter. If both are set, group_id takes precedence
  // and library_entry_id is ignored.
  string group_id = 3;
  string library_entry_id = 4;
}

message ListMusicReleasesResponse {
  repeated Release music_releases = 1;
  string next_page_token = 2;
}

message ListMusicReleaseTracksRequest {
  string release_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// ListMusicReleaseTracksResponse returns purser.domain.v1.Item directly —
// mirroring purser.afterdark.v1.BrowseService's ListScenesInNetwork — since
// a track is an ordinary kernel Item(ContentType=music), not a
// Music-specific wire type. See docs/adr/0021-music-domain-model.md's
// "Track ↔ Release linkage" section.
message ListMusicReleaseTracksResponse {
  repeated purser.domain.v1.Item tracks = 1;
  string next_page_token = 2;
}

// CreateMusicReleaseTrackRequest adds one track to release_id, per
// docs/adr/0021-music-domain-model.md's Track mapping. The created track
// always starts Status=missing — never wanted — matching
// buildTrackItem's existing pipeline-scan convention
// (internal/adapters/pipeline/music/persister.go) exactly.
message CreateMusicReleaseTrackRequest {
  string release_id = 1;
  string title = 2;
  // number is the track-number string, e.g. "3" or "A2" — mirrors
  // MusicBrainzTrack.number, not a bare position int.
  string number = 3;
  // medium_number is the 1-based disc/side.
  int32 medium_number = 4;
  int32 runtime_seconds = 5;
  // mbid is the recording MBID, empty for a hand-entered track. Accepted
  // on the wire for the MusicBrainz-populate caller but not yet persisted
  // anywhere server-side — see internal/service/music_release.go's
  // CreateTrack doc comment.
  string mbid = 6;
}

message CreateMusicReleaseTrackResponse {
  purser.domain.v1.Item track = 1;
}

// MusicReleaseService owns exactly one entity — Release — per
// docs/adr/0011-api-design.md's SRP-per-entity rule. ListByGroup/ListByEntry
// are exposed as optional filters on ListMusicReleases, the same pattern
// GroupService's ListGroups(library_entry_id) and ImageService's
// ListImages(owner_type, owner_id) already establish, rather than as
// dedicated RPCs. ListMusicReleaseTracks is the one exception: it returns a
// different entity (Item) than the rest of the service, so it can't be
// folded into ListMusicReleases as another filter — the same reasoning
// GetMusicReleaseByMBID/GetMusicReleaseByBarcode already establish for
// point lookups.
service MusicReleaseService {
  rpc CreateMusicRelease(CreateMusicReleaseRequest) returns (CreateMusicReleaseResponse);
  rpc GetMusicRelease(GetMusicReleaseRequest) returns (GetMusicReleaseResponse);
  rpc GetMusicReleaseByMBID(GetMusicReleaseByMBIDRequest) returns (GetMusicReleaseByMBIDResponse);
  rpc GetMusicReleaseByBarcode(GetMusicReleaseByBarcodeRequest) returns (GetMusicReleaseByBarcodeResponse);
  rpc UpdateMusicRelease(UpdateMusicReleaseRequest) returns (UpdateMusicReleaseResponse);
  rpc DeleteMusicRelease(DeleteMusicReleaseRequest) returns (DeleteMusicReleaseResponse);
  rpc ListMusicReleases(ListMusicReleasesRequest) returns (ListMusicReleasesResponse);
  rpc ListMusicReleaseTracks(ListMusicReleaseTracksRequest) returns (ListMusicReleaseTracksResponse);
  // CreateMusicReleaseTrack adds one track to a release, per
  // docs/adr/0021-music-domain-model.md. The only track-write entry point —
  // outside the disk-scan pipeline, nothing else creates one.
  rpc CreateMusicReleaseTrack(CreateMusicReleaseTrackRequest) returns (CreateMusicReleaseTrackResponse);
  // GetMusicReleaseDeletionImpact reports what references this Release
  // before Delete is called — see
  // docs/adr/0015-deletion-impact-and-composing-services.md.
  rpc GetMusicReleaseDeletionImpact(GetMusicReleaseDeletionImpactRequest) returns (GetMusicReleaseDeletionImpactResponse);
}
