syntax = "proto3";

package purser.job.v1;

import "google/protobuf/timestamp.proto";

option go_package = "purser/gen/go/purser/job/v1;jobv1";

// JobStatus mirrors pkg/jobqueue.Status — the lifecycle state shared by
// Job, Task, and Step. See docs/adr/0023-job-queue.md.
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  // JOB_STATUS_PARTIAL applies only to a Job (some Tasks succeeded, some
  // failed) — never to a Task or Step.
  JOB_STATUS_PARTIAL = 5;
}

// Step is one discrete action taken on a Task (e.g. "compute hashes",
// "query AcoustID"). detail carries structured, step-specific results —
// the piece a log line alone can't give a caller polling GetJob.
message Step {
  string id = 1;
  string name = 2;
  JobStatus status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  string message = 6;
  map<string, string> detail = 7;
}

// Task is one unit of work within a Job (one file, one track). progress is
// computed from steps, not stored.
message Task {
  string id = 1;
  string label = 2;
  JobStatus status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  repeated Step steps = 6;
  double progress = 7;
}

// Job is one overall long-running operation (e.g. "scan
// /music/new-arrivals"). progress is computed from tasks, not stored. See
// docs/adr/0023-job-queue.md — Job is ephemeral, in-process state, not
// Datastore-backed like every other entity's message in this codebase.
message Job {
  string id = 1;
  string kind = 2;
  JobStatus status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  repeated Task tasks = 7;
  double progress = 8;
  // params echoes the opaque, kind-specific configuration the Job was
  // triggered with (TriggerJobRequest.params) — read-only here, surfaced
  // for the job detail view. See docs/adr/0023-job-queue.md.
  map<string, string> params = 9;
}

message TriggerJobRequest {
  // kind selects which registered pkg/jobqueue.Executor runs this Job —
  // "diagnostic" is the only kind this pass registers.
  string kind = 1;
  repeated string task_labels = 2;
  // params is opaque, kind-specific configuration passed through to the
  // registered Executor unexamined — this package/service never interprets
  // its keys. The "diagnostic" kind reads "fail_at_step:<task label>" ->
  // step index to make that task's step fail with a synthetic error, for
  // exercising the partial/failed aggregation rule end-to-end. See
  // docs/adr/0023-job-queue.md.
  map<string, string> params = 3;
}

message TriggerJobResponse {
  string job_id = 1;
}

message GetJobRequest {
  string id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // kind is an optional filter — leave unset ("") for no filter.
  string kind = 3;
  // status is an optional filter — leave JOB_STATUS_UNSPECIFIED for no
  // filter.
  JobStatus status = 4;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  string next_page_token = 2;
}

// JobEventKind identifies which level of a Job's Job/Task/Step hierarchy a
// JobEvent describes.
enum JobEventKind {
  JOB_EVENT_KIND_UNSPECIFIED = 0;
  JOB_EVENT_KIND_JOB = 1;
  JOB_EVENT_KIND_TASK = 2;
  JOB_EVENT_KIND_STEP = 3;
}

// JobEvent wraps one Job/Task/Step transition, pushed by WatchJob as it
// happens. job is always the full, current snapshot of the Job (the same
// shape GetJobResponse.job carries), not a partial diff — task_id/step_id
// identify which part of it just changed, unset for a job-level
// transition. See docs/adr/0023-job-queue.md.
message JobEvent {
  JobEventKind kind = 1;
  string task_id = 2;
  string step_id = 3;
  Job job = 4;
}

message WatchJobRequest {
  string job_id = 1;
}

// JobService follows the same handler/service/error-mapping conventions as
// every entity's Connect service (docs/adr/0011-api-design.md), even
// though Job isn't Datastore-backed (docs/adr/0023-job-queue.md). WatchJob
// is the first server-streaming RPC in the codebase — see
// docs/adr/0023-job-queue.md's Consequences for why its stream-lifecycle
// pattern is worth reviewing carefully.
service JobService {
  rpc TriggerJob(TriggerJobRequest) returns (TriggerJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc WatchJob(WatchJobRequest) returns (stream JobEvent);
}
