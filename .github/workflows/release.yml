name: Release

# Lint → Test → Build → Release → Goreleaser
# All gates must pass; goreleaser (binaries + multi-arch container, see
# docs/adr/0017-build-and-release-goreleaser.md) only runs when
# semantic-release cuts a new version.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Stub web dist for compilation
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body>stub</body></html>' > web/dist/index.html

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: success()
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # Fast pre-release compile gate only — not a release artifact, so it
      # stays a plain `go build` rather than going through goreleaser (see
      # docs/adr/0017-build-and-release-goreleaser.md). The real release
      # binaries/images are built by the goreleaser job below.
      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -v \
            -ldflags="-X purser/internal/version.Version=dev" \
            -o ./bin/purser ./cmd/purser

      - name: Smoke test binary
        run: ./bin/purser --version

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Import GPG key so the release commit is signed with the project key.
      # Requires GPG_PRIVATE_KEY and GPG_PASSPHRASE secrets — see docs.
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: TheCaptiansLedger
          GIT_AUTHOR_EMAIL: cold.harp5900@fastmail.com
          GIT_COMMITTER_NAME: TheCaptiansLedger
          GIT_COMMITTER_EMAIL: cold.harp5900@fastmail.com

      - name: Apply release codename
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          minor=$(echo "${{ steps.semantic.outputs.new_release_version }}" | cut -d. -f2)
          idx=$((minor - 8))
          name=$(sed -n "$((idx + 1))p" .github/release-names.txt)
          if [ -n "$name" ]; then
            gh release edit "${{ steps.semantic.outputs.new_release_git_tag }}" --title "$name"
          fi

  goreleaser:
    name: Goreleaser (binaries + multi-arch container)
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds every OS/arch binary, attaches archives+checksums to the
      # GitHub Release semantic-release already created (release.mode:
      # append in .goreleaser.yaml), and builds+pushes the linux/amd64 +
      # linux/arm64 container manifest to GHCR — see
      # docs/adr/0017-build-and-release-goreleaser.md.
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
