syntax = "proto3";

package purser.pipeline.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "purser/domain/v1/media_file.proto";

option go_package = "purser/gen/go/purser/pipeline/v1;pipelinev1";

// UnmatchedFileStatus mirrors domain.UnmatchedFileStatus — the review
// queue's lifecycle state. See docs/adr/0024-pipeline-core.md.
enum UnmatchedFileStatus {
  UNMATCHED_FILE_STATUS_UNSPECIFIED = 0;
  UNMATCHED_FILE_STATUS_PENDING = 1;
  UNMATCHED_FILE_STATUS_MATCHED = 2;
  UNMATCHED_FILE_STATUS_DISMISSED = 3;
}

// MatchTier mirrors domain.MatchTier — how a MatchCandidate was found,
// strongest signal first. See
// docs/technical/pipeline-unmatchedfile-grouping.md.
enum MatchTier {
  MATCH_TIER_UNSPECIFIED = 0;
  MATCH_TIER_DIRECT_ID = 1;
  MATCH_TIER_UNIQUE_ID = 2;
  MATCH_TIER_FUZZY = 3;
  MATCH_TIER_ACOUSTIC = 4;
}

// Fingerprint mirrors domain.Fingerprint — generic, content-type-agnostic
// identification data extracted from a discovered file. metadata is a
// google.protobuf.Struct, not a plain string map (domain.Fingerprint.Metadata
// is map[string]any), matching the same pattern already used for
// Item/LibraryEntry/Group's Metadata bags.
message Fingerprint {
  map<string, string> tags = 1;
  google.protobuf.Struct metadata = 2;
}

// MatchCandidate mirrors domain.MatchCandidate — one ranked candidate a
// content-type's identifier produced for an UnmatchedFile.
message MatchCandidate {
  string external_ref = 1;
  string title = 2;
  double score = 3;
  MatchTier tier = 4;
  map<string, double> signals = 5;
  google.protobuf.Struct metadata = 6;
}

// UnmatchedFile is a file the common scan pipeline discovered and hashed
// but has not yet matched to a LibraryEntry/Item. See
// docs/adr/0024-pipeline-core.md.
message UnmatchedFile {
  string id = 1;
  string path = 2;
  int64 size = 3;

  // content_type is this file's scan root's configured domain.ContentType —
  // a plain, open string, matching purser.domain.v1.Item's own content_type
  // field (internal/domain.ContentType is a deliberately open vocabulary,
  // not a closed proto enum). Needed so a manual AcceptCandidate call,
  // which happens outside any scan Job's lifetime, still knows which
  // content type's Persister to dispatch to.
  string content_type = 15;

  string os_hash = 4;
  string md5 = 5;
  string sha1 = 6;
  string sha512 = 7;

  google.protobuf.Timestamp discovered_at = 8;
  UnmatchedFileStatus status = 9;

  // group_key identifies the identification unit this file belongs to —
  // files sharing a group_key are matched/decided together. See
  // docs/technical/pipeline-unmatchedfile-grouping.md.
  string group_key = 10;

  // disc_number and track_number are per-row, unlike everything else on
  // this message, which is shared identically across a group.
  // track_number is a string, not an int, matching Item.sequence's
  // existing convention — vinyl rips carry side-lettered positions ("A1",
  // "B3") an int field would silently drop on parse failure.
  int32 disc_number = 11;
  string track_number = 12;

  Fingerprint fingerprint = 13;
  repeated MatchCandidate candidates = 14;
}

message GetUnmatchedFileRequest {
  string id = 1;
}

message GetUnmatchedFileResponse {
  UnmatchedFile unmatched_file = 1;
}

message ListUnmatchedFilesRequest {
  int32 page_size = 1;
  string page_token = 2;
  // status is an optional filter — leave UNMATCHED_FILE_STATUS_UNSPECIFIED
  // for no filter.
  UnmatchedFileStatus status = 3;
}

message ListUnmatchedFilesResponse {
  repeated UnmatchedFile unmatched_files = 1;
  string next_page_token = 2;
}

// ResolveUnmatchedFileRequest resolves a review-queue entry one of two
// ways: match it to an existing Item (item_id set — creates a real
// MediaFile linking the file's path/hashes to that Item, then removes the
// UnmatchedFile), or dismiss it (kept, not deleted, with
// status=dismissed, so a later rescan's "already known" short-circuit
// doesn't silently re-queue it). See docs/adr/0024-pipeline-core.md.
message ResolveUnmatchedFileRequest {
  string unmatched_file_id = 1;
  oneof outcome {
    string item_id = 2;
    bool dismiss = 3;
  }
}

message ResolveUnmatchedFileResponse {
  // result is the real, resolved entity: the newly created MediaFile when
  // outcome was item_id, or the UnmatchedFile (now status=dismissed) when
  // outcome was dismiss.
  oneof result {
    purser.domain.v1.MediaFile media_file = 1;
    UnmatchedFile unmatched_file = 2;
  }
}

// ListGroupUnmatchedFilesRequest fetches every UnmatchedFile sharing one
// group_key — no pagination, since a group is expected to be small (one
// album's worth of tracks, not the whole review queue). See
// docs/technical/pipeline-unmatchedfile-grouping.md.
message ListGroupUnmatchedFilesRequest {
  string group_key = 1;
}

message ListGroupUnmatchedFilesResponse {
  repeated UnmatchedFile unmatched_files = 1;
}

// DismissUnmatchedFileBatchRequest dismisses the exact ID list the caller
// supplies (the UI already has it from ListGroupUnmatchedFiles) — the
// server does no group_key lookup of its own. All-or-nothing: one
// UpdateBatch call, per docs/adr/0016-bulk-operations.md.
message DismissUnmatchedFileBatchRequest {
  repeated string unmatched_file_ids = 1;
}

message DismissUnmatchedFileBatchResponse {
  repeated UnmatchedFile unmatched_files = 1;
}

// AcceptCandidateRequest persists a group's winning release, one of two
// ways: external_ref matches an existing ranked MatchCandidate in the
// group's Candidates (the common case — a human picks any ranked
// candidate, not necessarily the top-scored one), or it's a raw MusicBrainz
// release MBID the pipeline never generated (a human already knows the
// correct release and typed it in) — the review UI must expose both paths
// at once. On success, every UnmatchedFile sharing group_key leaves the
// review queue by deletion, the same behavior ResolveUnmatchedFile already
// has for a single file. See docs/technical/pipeline-music-persist.md.
message AcceptCandidateRequest {
  string group_key = 1;
  string external_ref = 2;
}

message AcceptCandidateResponse {}

// UnmatchedFileService is the review queue's Get/List/Resolve surface.
// Follows the same handler/service/error-mapping conventions as every
// other entity's Connect service (docs/adr/0011-api-design.md). See
// docs/adr/0024-pipeline-core.md.
service UnmatchedFileService {
  rpc GetUnmatchedFile(GetUnmatchedFileRequest) returns (GetUnmatchedFileResponse);
  rpc ListUnmatchedFiles(ListUnmatchedFilesRequest) returns (ListUnmatchedFilesResponse);
  rpc ResolveUnmatchedFile(ResolveUnmatchedFileRequest) returns (ResolveUnmatchedFileResponse);
  rpc ListGroupUnmatchedFiles(ListGroupUnmatchedFilesRequest) returns (ListGroupUnmatchedFilesResponse);
  rpc DismissUnmatchedFileBatch(DismissUnmatchedFileBatchRequest) returns (DismissUnmatchedFileBatchResponse);
  rpc AcceptCandidate(AcceptCandidateRequest) returns (AcceptCandidateResponse);
}
