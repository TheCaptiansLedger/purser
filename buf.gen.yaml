version: v2
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative
  # TypeScript side, consumed by web/ — see docs/design/frontend-stack.md.
  # protoc-gen-connect-query also emits the plain Connect client, so no
  # separate protoc-gen-connect-es plugin is needed on top of it.
  - local: protoc-gen-es
    out: web/src/gen
    opt: target=ts
  - local: protoc-gen-connect-query
    out: web/src/gen
    opt: target=ts
